# Knowledge checks (drv-065): a question this repo's agent context should answer, run
# read-only in a throwaway clone. Assertions are deterministic where possible; an
# llm-rubric only where the rule is a judgement ("does not recommend X").
#
# Each docs ticket adds or adjusts its own case(s) here — tag it with `ticket:` so a
# before/after comparison can be filtered with EVALS_FILTER=ticket=<id>.
#
# Every assertion reads the agent's answer out of the provider's JSON verdict.

- description: "knowledge: run the test pyramid without blocking (drv-058)"
  metadata: {kind: knowledge, ticket: drv-058, weight: light}
  vars:
    prompt: >-
      You are a coding agent working a ticket in this repository. The full test
      pyramid takes several minutes. Using this repository's own docs and agent
      instructions, how should you run the full climb without blocking your session
      or hitting a tool timeout, and what should you avoid doing while it runs? Name
      the exact commands. Answer briefly.
  assert:
    - type: icontains-all
      transform: JSON.parse(output).answer
      value: ["--detach", "park"]
    - type: llm-rubric
      transform: JSON.parse(output).answer
      value: >-
        The answer tells the agent to launch the climb detached and then park (for
        example `draiver test --detach && draiver park <ticket>`), and it does NOT
        recommend polling with sleep loops; warning against sleep-polling is good.

- description: "knowledge: what every BDD scenario must attach (drv-058)"
  metadata: {kind: knowledge, ticket: drv-058, weight: light}
  vars:
    prompt: >-
      You are a coding agent adding a BDD acceptance scenario in this repository.
      According to this repository's docs and tests, what must every scenario attach,
      and which helpers do you use for UI versus non-UI evidence? Answer briefly.
  assert:
    - type: icontains-all
      transform: JSON.parse(output).answer
      value: ["attachText", "shoot"]
    - type: llm-rubric
      transform: JSON.parse(output).answer
      value: >-
        The answer says EVERY scenario must attach at least one artefact (not only
        user-visible ones): a screenshot via shoot(...) for UI, or attachText(...) for
        non-UI evidence.

- description: "knowledge: branch diff when main has moved — three dots (drv-059)"
  metadata: {kind: knowledge, ticket: drv-059, weight: light}
  vars:
    prompt: >-
      You are a coding agent on a ticket branch in this repository, and main has gained
      new commits since your branch was cut. How do you see only what YOUR branch
      changed versus main? Give the exact git commands. Answer briefly.
  assert:
    - type: regex
      transform: JSON.parse(output).answer
      value: "main\\.\\.\\.(HEAD|@)|merge-base"
    - type: llm-rubric
      transform: JSON.parse(output).answer
      value: >-
        The answer compares against the merge base (a three-dot `git diff main...HEAD`
        or an explicit `git merge-base`) and does not recommend a two-dot
        `git diff main..HEAD` as the way to see the branch's own changes.

- description: "knowledge: review feedback outside the spec (drv-059)"
  metadata: {kind: knowledge, ticket: drv-059, weight: light}
  vars:
    prompt: >-
      You are a coding agent working a draiver ticket in this repository. A reviewer's
      feedback asks for a new control and a change that belong to a different concern
      than your ticket's spec. What should you do before writing any code for it?
      Answer briefly.
  assert:
    - type: icontains
      transform: JSON.parse(output).answer
      value: escalate
    - type: llm-rubric
      transform: JSON.parse(output).answer
      value: >-
        The answer says to confirm scope with the human (via `draiver escalate`)
        before implementing feedback that goes beyond the spec, rather than just
        implementing it.

- description: "knowledge: where the acceptance helpers live and how to register a step (drv-060)"
  metadata: {kind: knowledge, ticket: drv-060, weight: light}
  vars:
    prompt: >-
      You are a coding agent about to add a BDD step definition in this repository.
      Where do the acceptance step definitions and their shared helpers live, and how
      is a new step registered so the runner finds it? Name files and functions.
      Answer briefly.
  assert:
    - type: icontains-all
      transform: JSON.parse(output).answer
      value: ["internal/acceptance", "registry", "init"]

- description: "knowledge: which acceptance helpers to reuse for a board and the CLI (drv-060)"
  metadata: {kind: knowledge, ticket: drv-060, weight: light}
  vars:
    prompt: >-
      You are a coding agent writing BDD steps in this repository. One scenario needs
      a live web board over a seeded data root; another needs to run the real draiver
      CLI. Which existing helper functions should your steps reuse for each, and
      where are they defined? Answer briefly.
  assert:
    - type: icontains-all
      transform: JSON.parse(output).answer
      value: ["seedBoard", "overlayBin"]
    - type: llm-rubric
      transform: JSON.parse(output).answer
      value: >-
        The answer names existing helpers (such as seedBoard/currentBoard for the board
        and overlayBin for the built draiver binary) rather than proposing to write new
        fixtures from scratch, and it does not invent helper names that do not exist.

- description: "knowledge: changelog style without reading CHANGELOG.md (drv-061)"
  metadata: {kind: knowledge, ticket: drv-061, weight: light}
  vars:
    prompt: >-
      You are a coding agent who needs to write this ticket's changelog entry in this
      repository, in the house style. Where do you write it, and where should you look
      to learn the style? Answer briefly.
  assert:
    - type: icontains
      transform: JSON.parse(output).answer
      value: changelog.d/
    - type: llm-rubric
      transform: JSON.parse(output).answer
      value: >-
        The answer says to write a changelog.d/<ticket-id>.md fragment and to learn the
        style from changelog.d (its README or recent fragments), and does NOT tell the
        agent to read or edit the generated CHANGELOG.md.

- description: "knowledge: run only your own BDD scenarios (drv-063)"
  metadata: {kind: knowledge, ticket: drv-063, weight: light}
  vars:
    prompt: >-
      You are a coding agent iterating on the BDD scenarios you added for ticket
      drv-123 in this repository. How do you run only those scenarios, without the
      whole acceptance suite, and can that run count as the passing result the review
      gate needs? Name the exact commands. Answer briefly.
  assert:
    - type: icontains-all
      transform: JSON.parse(output).answer
      value: ["--tags", "@drv-123"]
    - type: llm-rubric
      transform: JSON.parse(output).answer
      value: >-
        The answer runs a focused run with a tag filter (for example `draiver test
        acceptance --tags @drv-123` or `go run ./features/acceptance --tags @drv-123`),
        says a focused run records no rung result and so cannot satisfy the review
        gate (the full suite must still be climbed), and does NOT suggest writing a
        throwaway zz_*_test.go wrapper.

- description: "knowledge: where draiver's version comes from (drv-061)"
  metadata: {kind: knowledge, ticket: drv-061, weight: light}
  vars:
    prompt: >-
      You are a coding agent in this repository. Where does the version printed by
      `draiver --version` come from, and does adding a changelog fragment on a ticket
      branch change it? Name the function responsible. Answer briefly.
  assert:
    - type: icontains
      transform: JSON.parse(output).answer
      value: FromChangelog
    - type: llm-rubric
      transform: JSON.parse(output).answer
      value: >-
        The answer says the version is the topmost released `## [x.y.z]` section of
        CHANGELOG.md (embedded in the binary, read by version.FromChangelog), that
        Unreleased is skipped, and that a fragment alone does not change it — only
        cutting a release does.

- description: "knowledge: which rungs gate review, and why integration is advisory (drv-061)"
  metadata: {kind: knowledge, ticket: drv-061, weight: light}
  vars:
    prompt: >-
      You are a coding agent in this repository. Which of this repo's test-pyramid
      rungs must be green for the review gate, which are advisory, and why is the
      integration rung advisory rather than required? Answer briefly.
  assert:
    - type: icontains-all
      transform: JSON.parse(output).answer
      value: ["changelog", "unit", "acceptance", "integration"]
    - type: llm-rubric
      transform: JSON.parse(output).answer
      value: >-
        The answer says changelog, unit and acceptance are required (they gate
        review), integration and evals are advisory (required: false), and that
        integration is advisory because it needs a container runtime / skips cleanly
        without one, so it must not block the gate (enforcement is separate from
        altitude ordering).

- description: "knowledge: reading a very large source file cheaply (drv-061)"
  metadata: {kind: knowledge, ticket: drv-061, weight: light, case: large-file-read}
  vars:
    prompt: >-
      You are a coding agent in this repository and need to change one handler in
      internal/web/web.go, which is about 3,000 lines long. Following this
      repository's agent instructions, how should you read it? Answer briefly.
  assert:
    # promptfoo's regex is JavaScript: no inline (?i) flags.
    - type: regex
      transform: JSON.parse(output).answer
      value: "[Gg]rep|\\brg\\b|[Ss]earch"
    - type: regex
      transform: JSON.parse(output).answer
      value: "offset|limit"
    - type: llm-rubric
      transform: JSON.parse(output).answer
      value: >-
        The answer says to grep/search for the symbol first and then Read only the
        relevant range (offset/limit) rather than the whole file, AND presents this as
        this repository's own instruction (e.g. AGENTS.md's rule for files over about
        500 lines). An answer that says the repo's instructions do not cover this
        FAILS, even if its general advice is sound.
