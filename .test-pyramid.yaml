# .test-pyramid.yaml — draiver's own test pyramid (drv-010, dogfooding drv-009).
#
# Levels are ordered bottom-to-top: the list order IS the pyramid — intrinsic
# altitude on the testing V (unit < acceptance < integration), and ONLY that.
#
# `required` (drv-025) is orthogonal to that order: it is per-rung ENFORCEMENT, a
# policy driven by flakiness/environment/confidence, not by altitude. A rung
# defaults to `required: true` (gates review); `required: false` makes it ADVISORY —
# still defined, still run when it lies in the climb path, still reported, but a red
# result (a real failure OR an unready env) never blocks the review gate and never
# halts the climb. A required rung may legitimately sit above an advisory one.
#
# drv-009's Review gate therefore folds the whole *required set*: every required rung
# must be green-at-HEAD before a claim is accepted. For this repo that is unit +
# acceptance; integration is advisory (see below).
#
#   unit        — today's fast, container-free suite; the near-universal base rung. REQUIRED.
#   acceptance  — drv-019's BDD rung (Gherkin under features/). REQUIRED.
#   integration — Testcontainers suite (a real Forgejo forge + a real served webui)
#                 behind the `integration` build tag. ADVISORY (required: false): it
#                 needs a container runtime (Docker/Podman) and already skips cleanly
#                 when none is present, so it must not be able to block the gate — the
#                 exact case per-rung `required` exists for. Altitude keeps it on top;
#                 enforcement sets it advisory, without corrupting the ordering.
#
# Run it locally with `draiver test integration` (an explicit RUNG climbs into
# advisory rungs) or, directly, `go test -tags=integration ./internal/e2e/integration/...`.
# See docs/integration-testing.md. Bare `draiver test` climbs to `acceptance` (the
# highest required rung) by default and does not run integration.
# environments (drv-012) factor *where* a rung runs out of *what* it runs. A rung
# names one by `environment:`; unset = the implicit ambient context (the unit rung
# below). Each env says how to bring it `up`, tear it `down`, and `healthcheck`
# whether it is ready — a red healthcheck blocks the rung (dependency not ready), a
# failed `up` is an infra fault (escalate), a failed `run` is a code fault.
#
# The integration rung targets `local`. We keep `up`/`down` omitted (the
# Testcontainers suite owns its own containers) and the healthcheck a genuine, always
# -green local precondition — the Go toolchain is present — so dogfooding drv-012 here
# does NOT change this repo's gate: the integration suite already skips cleanly when
# no container runtime is present, and we deliberately do not convert that clean-skip
# into a block as a side effect of this ticket.
#
# The realistic production pattern — a `container-runtime` healthcheck
# (`docker info || podman info`) that *blocks* the rung on a box with no runtime
# rather than letting it false-green — is written up in docs/test-pyramid.md.
environments:
  - name: local
    # up/down intentionally omitted: the integration suite stands up and tears down
    # its own Testcontainers, so there is no ambient env for draiver to own here.
    healthchecks:
      - name: go-toolchain
        script: go version

  # bdd is the test environment the acceptance rung requires (drv-019 AC): `up`
  # installs the Playwright node package (browsers come from the shared
  # $PLAYWRIGHT_BROWSERS_PATH cache, so this only adds the npm package) and prepares
  # the artefact output dir the runner writes into. The healthchecks prove every
  # dependency the rung needs — the Go toolchain, a resolvable `playwright`, and a
  # chromium binary on disk — so a box without a browser BLOCKS the rung / the board
  # rerun ("pass the ball") rather than emitting bogus or empty screenshots (drv-012,
  # decision #23). The steps capture real Playwright screenshots of the live webui.
  - name: bdd
    up: npm install --prefix features/screenshots --no-audit --no-fund --silent && mkdir -p features/_artifacts/screenshots
    healthchecks:
      - name: go-toolchain
        script: go version
      - name: playwright-browser
        script: NODE_PATH=features/screenshots/node_modules node -e "require('playwright')" && ls ${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}/chromium-*/chrome-linux/chrome >/dev/null 2>&1

  # review is this repo's own qualifying REVIEW environment (drv-020): up + down + a real
  # healthcheck make it review-ready, so draiver's controlplane can guarantee and verify
  # teardown. It is referenced only by the per-repo `reviewEnvironment` setting (set it in
  # the attempt page's repo-settings panel to `review`), NOT by any level — so it never
  # runs during `draiver test`; it is launched on demand from an attempt page in Review.
  #
  # review-env/up.sh spins up the REAL draiver webui (resolution #51) — built from this
  # detached review worktree (the reviewed commit), so the instance a reviewer drives IS
  # the UI change under review — bound to the injected DRAIVER_REVIEW_PORT. It must NOT
  # clash with the operator's own running draiver, so it exports DRAIVER_DATA/DRAIVER_CONFIG
  # at a throwaway per-instance .review-env-run/ work area inside the worktree (every board
  # write lands in dummy data, never ~/.draiver) and seeds a few dummy tickets across the
  # board states. ENV_NAME — a repo-declared parameterisation var (resolution #45) the
  # launch form exposes as an editable input, defaulting to "review" — titles those seeded
  # tickets, so the web-UI-set value visibly parameterises the running instance. down.sh
  # stops the webui and the healthcheck probes the port (green = up on confirm-up, red =
  # gone on confirm-down). The url template draiver expands with the injected port is what
  # the reviewer clicks.
  - name: review
    up: sh review-env/up.sh
    down: sh review-env/down.sh
    healthchecks:
      - name: http-ready
        script: sh review-env/healthcheck.sh
    url: http://127.0.0.1:${DRAIVER_REVIEW_PORT}/
    params:
      - name: ENV_NAME
        default: review

  # review-cli is a SECOND qualifying review environment (drv-032 #12/#22), for reviewing
  # CLI changes the webui `review` env above cannot exercise. The recall work on this ticket
  # (--tags, the ticket@attempt form, the stderr attempt-aware header) is a terminal feature,
  # so this stands up a ttyd web terminal (tsl0922/ttyd) in a sandboxed docker container over
  # the reviewed draiver binary and a pre-seeded board — a browser shell the reviewer drives.
  #
  # It COEXISTS with `review`: the per-repo `reviewEnvironment` setting names ONE env, so an
  # operator reviewing a CLI ticket points it at `review-cli` from the attempt page (and back
  # to `review` for UI tickets) — this entry changes no default on its own. Like `review`, it
  # is referenced only by that setting, never by a level, so it never runs during `draiver
  # test`; it is launched on demand from an attempt page in Review.
  #
  # review-env/ttyd/up.sh binds the injected DRAIVER_REVIEW_PORT and namespaces its
  # container/image by DRAIVER_REVIEW_INSTANCE, so concurrent review envs never collide;
  # down.sh force-removes that container (releasing the port) and healthcheck.sh HTTP-probes
  # it. See review-env/ttyd/README.md.
  - name: review-cli
    up: sh review-env/ttyd/up.sh
    down: sh review-env/ttyd/down.sh
    healthchecks:
      - name: ttyd-ready
        script: sh review-env/ttyd/healthcheck.sh
    url: http://127.0.0.1:${DRAIVER_REVIEW_PORT}/

levels:
  - name: unit
    run: go test ./...
  # acceptance is drv-019's BDD rung: it runs the Gherkin under features/ via the
  # runner-agnostic Go runner (internal/acceptance), which emits standard
  # cucumber-JSON plus PNG screenshot artefacts. cucumber_json marks it a BDD rung
  # (drv-016) so draiver captures the report; artifacts captures the screenshots
  # side by side (drv-017). It binds the `bdd` environment, and is the rung the
  # board's "rerun" regenerates (drv-019).
  - name: acceptance
    run: go run ./features/acceptance
    environment: bdd
    cucumber_json: features/_artifacts/cucumber.json
    artifacts:
      - features/_artifacts/screenshots
  - name: integration
    run: go test -tags=integration ./internal/e2e/integration/...
    environment: local
    # Advisory (drv-025): altitude keeps integration at the top of the V, but
    # enforcement makes it non-blocking. It needs a container runtime and skips
    # cleanly without one, so gating review on it would be a flakiness policy
    # smuggled into altitude ordering — exactly what `required` decouples.
    required: false
