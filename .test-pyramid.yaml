# .test-pyramid.yaml — draiver's own test pyramid (drv-010).
# Why each entry is the way it is: docs/test-pyramid.md, "This repo's pyramid".
# Required (gate review): changelog, unit, acceptance. Advisory: integration, evals.
# Semantics are pinned by TestRepoPyramidSemantics (internal/pyramid); comments are free.
environments:
  # integration rung + `local` promotion; Testcontainers owns its own containers.
  - name: local
    healthchecks:
      - name: go-toolchain
        script: go version

  # acceptance rung: Playwright package + a chromium on disk, else the rung blocks.
  - name: bdd
    up: npm install --prefix features/screenshots --no-audit --no-fund --silent && mkdir -p features/_artifacts/screenshots
    healthchecks:
      - name: go-toolchain
        script: go version
      - name: playwright-browser
        script: NODE_PATH=features/screenshots/node_modules node -e "require('playwright')" && ls ${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}/chromium-*/chrome-linux/chrome >/dev/null 2>&1

  # review env (drv-020): the real webui on throwaway data; launched from an attempt page.
  - name: review
    up: sh review-env/up.sh
    down: sh review-env/down.sh
    healthchecks:
      - name: http-ready
        script: sh review-env/healthcheck.sh
    url: http://127.0.0.1:${DRAIVER_REVIEW_PORT}/
    params:
      - name: ENV_NAME
        default: review

  # review env for CLI changes (drv-032): a ttyd web terminal. See review-env/ttyd/README.md.
  - name: review-cli
    up: sh review-env/ttyd/up.sh
    down: sh review-env/ttyd/down.sh
    healthchecks:
      - name: ttyd-ready
        script: sh review-env/ttyd/healthcheck.sh
    url: http://127.0.0.1:${DRAIVER_REVIEW_PORT}/

  # forgejo-main promotion target (drv-043); blocks when the forgejo remote is unreachable.
  - name: forgejo-main
    healthchecks:
      - name: forgejo-reachable
        script: git ls-remote --heads forgejo >/dev/null 2>&1

  # evals rung (drv-065): promptfoo + the claude CLI and credentials. See docs/evals.md.
  - name: agent
    up: (npm ls --prefix evals --depth=0 >/dev/null 2>&1 || npm install --prefix evals --no-audit --no-fund --silent) && npm install --prefix features/screenshots --no-audit --no-fund --silent
    healthchecks:
      - name: promptfoo
        script: test -x evals/node_modules/.bin/promptfoo
      - name: claude-cli
        script: command -v claude >/dev/null
      - name: claude-credentials
        script: >-
          test -n "${ANTHROPIC_API_KEY:-}" || claude auth status 2>/dev/null | grep -q '"loggedIn": true'

# Bottom to top: list order is altitude; `required: false` makes a rung advisory.
levels:
  # drv-052: changelog.d/<ticket-id>.md must exist; every fragment must be valid.
  - name: changelog
    run: go run ./cmd/changelog check
  - name: unit
    run: go test ./...
  # drv-019 BDD rung: Gherkin under features/, cucumber-JSON + screenshots.
  - name: acceptance
    run: go run ./features/acceptance
    environment: bdd
    cucumber_json: features/_artifacts/cucumber.json
    artifacts:
      - features/_artifacts/screenshots
  # Testcontainers suite; skips cleanly without a container runtime. See docs/integration-testing.md.
  - name: integration
    run: go test -tags=integration ./internal/e2e/integration/...
    environment: local
    required: false
  # Agent-context evals; run with `draiver test evals --only`. See docs/evals.md.
  - name: evals
    run: sh evals/run.sh
    environment: agent
    required: false
    artifacts:
      - evals/_artifacts

# Verified, never performed or gating (drv-043): exit 0 from `qa` == promoted.
promotions:
  - environment: local
    base: main
    qa: test "$DRAIVER_PROMOTE_ENV" = local && test "$DRAIVER_PROMOTE_BASE" = main

  # Green once the reviewed commit is an ancestor of forgejo's main.
  - environment: forgejo-main
    base: main
    qa: git fetch --quiet forgejo "$DRAIVER_PROMOTE_BASE" && git merge-base --is-ancestor HEAD FETCH_HEAD
